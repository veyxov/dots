gui:
  skipAmendWarning: true
  showRootItemInFileTree: false
  nerdFontsVersion: "3"

update:
  method: never
keybinding:
  universal:
    quit: [<esc>]
    return: <ctrl+x>

git:
  overrideGpg: true
  diffRenderers:
    - command: git-delta-theme --paging=never
    - type: extDiff
      command: difft --color=always --context={{diffContext}}

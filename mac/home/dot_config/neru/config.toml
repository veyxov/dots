[general]
passthrough_unbounded_keys = true
should_exit_after_passthrough = true

[hints]
strategy = "vision"                         # Element detection: "axtree" (AX API) or "vision" (Vision Framework)
hint_characters = "nesidarht"               # Home row of veyxov QMK layout (AEIH | RSND + thumb T)

[hints.hotkeys]
"Escape" = "idle"
"/" = "action search_hints"
"Backspace" = "action backspace"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action mouse_down"
"Shift+U" = "action mouse_up"
"Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Down" = "action move_mouse_relative --dx=0 --dy=5"
"Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Right" = "action move_mouse_relative --dx=5 --dy=0"

[hints.ui]
font_size = 9
border_width = 1
placement = "bottom"                        # top, center, bottom

[grid]
enabled = true
characters = "nesidarhtm/f?gyloxkcu"
sublayer_keys = "nesidarhtm/f?gyloxkcu"
live_match_update = true                    # Highlight cells as you type
hide_unmatched = true                       # Hide non-matching cells
prewarm_enabled = true                      # Pre-compute grid on startup (~1.5MB RAM)
enable_gc = false                           # Periodic memory cleanup (adds CPU overhead)

[grid.hotkeys]
"Escape" = "idle"
"`" = "toggle-cursor-follow-selection"
"Space" = "action reset"
"Backspace" = "action backspace"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action mouse_down"
"Shift+U" = "action mouse_up"
"Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Down" = "action move_mouse_relative --dx=0 --dy=5"
"Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Right" = "action move_mouse_relative --dx=5 --dy=0"

[grid.ui]
font_size = 10
font_family = ""
border_width = 1

[recursive_grid]
keys = "sndaeirth"
max_depth = 4

[recursive_grid.hotkeys]
"Escape" = "idle"
"Space" = "action reset"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action mouse_down"
"Shift+U" = "action mouse_up"
"Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Down" = "action move_mouse_relative --dx=0 --dy=5"
"Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Right" = "action move_mouse_relative --dx=5 --dy=0"

[recursive_grid.ui]
line_width = 2
font_size = 15
sub_key_preview = true                     # Draw miniature key grid inside each cell
sub_key_preview_font_size = 8
sub_key_preview_autohide_multiplier = 1.5

# Scroll mode
# See https://github.com/y3owk1n/neru/blob/main/docs/CONFIGURATION.md#scroll
[scroll]
scroll_step = 300                            # Pixels per arrow-key press
scroll_step_half = 800                      # Pixels for d/u (half page)
scroll_step_full = 1000000                  # Pixels for gg/G (top/bottom)
invert_scroll = false                       # Invert scroll direction (for tools like Mos)

[scroll.hotkeys]
"Escape" = "idle"
"Up" = "action scroll_up"
"Down" = "action scroll_down"
"Left" = "action scroll_left"
"Right" = "action scroll_right"
"gg" = "action go_top"
"Shift+G" = "action go_bottom"
"Shift+/" = "action page_up"
"/" = "action page_down"
"e" = "action left_click"
"i" = "action right_click"
"o" = "action middle_click"
"u" = "action mouse_down"
"y" = "action mouse_up"
# Left-hand home row = mouse move (right hand carries the NAV layer)
"s" = "action move_mouse_relative --dx=0 --dy=-5"
"n" = "action move_mouse_relative --dx=0 --dy=5"
"r" = "action move_mouse_relative --dx=-5 --dy=0"
"d" = "action move_mouse_relative --dx=5 --dy=0"
# Diagonals: row above/below the R/D columns (no simultaneous-key composition in neru)
"f" = "action move_mouse_relative --dx=-5 --dy=-5"
"v" = "action move_mouse_relative --dx=5 --dy=-5"
"x" = "action move_mouse_relative --dx=-5 --dy=5"
"c" = "action move_mouse_relative --dx=5 --dy=5"

# Sticky modifiers
# See https://github.com/y3owk1n/neru/blob/main/docs/CONFIGURATION.md#sticky_modifiers
[sticky_modifiers]
enabled = true
tap_max_duration = 300

[sticky_modifiers.ui]
font_size = 10
font_family = ""
border_width = 1
padding_x = -1
padding_y = -1
border_radius = -1
indicator_x_offset = -40
indicator_y_offset = 20

[systray]
enabled = false

[logging]
log_level = "warn"                          # debug, info, warn, error
log_file = "/tmp/neru.log"                               # Custom log path (empty = default location)

[hotkeys]
"Primary+Shift+Space" = "hints --action left_click"
"Primary+Shift+G" = "grid --action left_click"
"Primary+Shift+C" = "recursive_grid --action left_click"
"Primary+Shift+S" = "scroll"

# Held-key repeat + mouse-move acceleration
# See https://github.com/y3owk1n/neru/blob/main/docs/CONFIGURATION.md#held_repeat
[held_repeat]
enabled = true
initial_delay_ms = 150                      # Tap-vs-slide threshold
interval_ms = 10                            # One tick per frame at 100Hz
accel_enabled = true
accel_ramp_ms = 2500                        # Time from first repeat to top speed
accel_max_multiplier = 35.0                 # Calibrated against the 5px step above
accel_targets = ["move_mouse_relative"]

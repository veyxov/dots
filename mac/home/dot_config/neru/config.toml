[general]
excluded_apps = []
kb_layout_to_use = ""
passthrough_unbounded_keys = true
should_exit_after_passthrough = true
passthrough_unbounded_keys_blacklist = []
hide_overlay_in_screen_share = true
# exec_shell = "/bin/bash"                   # absolute path overrides on every platform, so pick one that's valid everywhere
# exec_shell_args = ["-lc"]

[theme.light]
surface = "#EEF2FF"
accent = "#465FBC"
accent_alt = "#0B2377"
on_accent_alt = "#F8FAFF"
text = "#17327A"

[theme.dark]
surface = "#0A1338"
accent = "#6E82D6"
accent_alt = "#8FA2F0"
on_accent_alt = "#081022"
text = "#E8EEFF"

[hotkeys]
"Primary+Shift+Space" = "hints --action left_click"
"Primary+Shift+G" = "grid --action left_click"
"Primary+Shift+C" = "recursive_grid --action left_click"
"Primary+Shift+S" = "scroll"

# [macros]
# click_and_exit = ["action left_click --bail-on-error", "idle"]
# click_at = ["action move_mouse --x $1 --y $2", "action left_click"]
#
# [hints.hotkeys]
# "Enter" = "macro click_and_exit"

[[app_configs]]
bundle_id = "com.tdesktop.Telegram"
hotkeys = { "Primary+Shift+R" = "action feed cmd+up" } # Telegram's native reply-to-last-message shortcut

[hints]
enabled = true
strategy = "axtree"
hint_characters = "nesidarht"               # veyxov home row: AEIH | RSND + thumb T
label_direction = "normal"
max_depth = 50
include_menubar_hints = false
additional_menubar_hints_targets = [
    "com.apple.TextInputMenuAgent",
    "com.apple.controlcenter",
    "com.apple.systemuiserver",
    "com.y3owk1n.neru",
]
include_dock_hints = false
include_nc_hints = false
include_stage_manager_hints = false
include_pip_hints = false
include_screen_capture_hints = false
detect_mission_control = false
# on_mission_control_activated = "idle"     # left unset: an empty value here would claim a default that doesn't exist
# on_mission_control_deactivated = ["hints"]
clickable_roles = [
    "button",
    "menu_button",
    "popup_button",
    "combo_box",
    "checkbox",
    "radio",
    "switch",
    "disclosure",
    "link",
    "text_field",
    "text_area",
    "slider",
    "tab",
    "menu_item",
    "cell",
    "row",
    "ax:AXGenericElement",
]
ignore_clickable_check = false
visible_check_enabled = false

[hints.hotkeys]
"Escape" = "idle"
"/" = "action search_hints"
"Backspace" = "action backspace"
"Tab" = "action cycle_hint"
"Shift+Tab" = "action cycle_hint --backward"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action left_click --state down"
"Shift+U" = "action left_click --state up"
"Up" = "action move_mouse_relative --dx=0 --dy=-10"
"Down" = "action move_mouse_relative --dx=0 --dy=10"
"Left" = "action move_mouse_relative --dx=-10 --dy=0"
"Right" = "action move_mouse_relative --dx=10 --dy=0"

[hints.ui]
font_size = 10
font_family = ""
border_radius = -1
padding_x = -1
padding_y = -1
border_width = 1
placement = "bottom"

[hints.search_input_ui]
font_size = 10
font_family = ""
border_radius = -1
padding_x = -1
padding_y = -1
border_width = 1
position = "bottom_center"
x_offset = 0
y_offset = 24
width = 320

[hints.boundary_highlight]
enabled = false
border_width = 1
border_radius = -1

[hints.vision]
detect_text = true
detect_rectangles = true
request_timeout_ms = 5000
minimum_confidence = 0.0
merge_iou_threshold = 0.5
rectangle_max_candidates = 100
rectangle_min_size = 0.01
rectangle_min_aspect = 0.3
rectangle_max_aspect = 10.0
button_min_confidence = 0.3
button_min_aspect = 0.8
button_max_aspect = 8.0
button_icon_max_size = 48
link_min_aspect = 5.0
link_max_height = 40
link_min_width = 50
image_min_size = 48
checkbox_max_size = 32
generic_clickable_min_confidence = 0.5

[grid]
enabled = true
characters = "nesidarhtm/f?gyloxkcu"        # veyxov layout, home row first then outward reach
sublayer_keys = "nesidarhtm/f?gyloxkcu"
row_labels = ""
col_labels = ""
live_match_update = true
hide_unmatched = true
prewarm_enabled = true
enable_gc = false

[grid.hotkeys]
"Escape" = "idle"
"`" = "toggle-cursor-follow-selection"
"Space" = "action reset"
"Backspace" = "action backspace"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action left_click --state down"
"Shift+U" = "action left_click --state up"
"Up" = "action move_mouse_relative --dx=0 --dy=-10"
"Down" = "action move_mouse_relative --dx=0 --dy=10"
"Left" = "action move_mouse_relative --dx=-10 --dy=0"
"Right" = "action move_mouse_relative --dx=10 --dy=0"

[grid.ui]
font_size = 10
font_family = ""
border_width = 1

[recursive_grid]
enabled = true
grid_cols = 3
grid_rows = 3
keys = "aeisndrth"                          # 3x3 = veyxov home row
min_size_width = 1
min_size_height = 1
max_depth = 10

[recursive_grid.animation]
enabled = true
duration_ms = 50

[recursive_grid.hotkeys]
"Escape" = "idle"
"`" = "toggle-cursor-follow-selection"
"Space" = "action reset"
"Backspace" = "action backspace"
"Shift+L" = "action left_click"
"Shift+R" = "action right_click"
"Shift+M" = "action middle_click"
"Shift+I" = "action left_click --state down"
"Shift+U" = "action left_click --state up"
"Up" = "action move_mouse_relative --dx=0 --dy=-10"
"Down" = "action move_mouse_relative --dx=0 --dy=10"
"Left" = "action move_mouse_relative --dx=-10 --dy=0"
"Right" = "action move_mouse_relative --dx=10 --dy=0"

[recursive_grid.ui]
line_width = 1
font_size = 10
font_family = ""
label_background = false
label_background_padding_x = -1
label_background_padding_y = -1
label_background_border_radius = -1
label_background_border_width = 1
label_char = ""
label_autohide_multiplier = 1.5
sub_key_preview = false
sub_key_preview_font_size = 8
sub_key_preview_autohide_multiplier = 1.5
sub_key_preview_label_char = ""

[virtual_pointer.ui]
char = "●"
font_size = 8
font_family = ""

[mouse_action_indicator]
enabled = false
actions = [
  "left_click",
  "right_click",
  "middle_click",
  "left_mouse_down",
  "left_mouse_up",
  "right_mouse_down",
  "right_mouse_up",
  "middle_mouse_down",
  "middle_mouse_up",
  "left_mouse_toggle",
  "right_mouse_toggle",
  "middle_mouse_toggle",
]

[mouse_action_indicator.ui]
size = 36
border_width = 2
shape = "circle"

[mouse_action_indicator.animation]
duration_ms = 260
start_scale = 0.55
end_scale = 1.35
start_opacity = 0.85
end_opacity = 0.0
easing = "ease_out"

[monitor_select]
enabled = false
characters = "123456789"

[monitor_select.ui]
font_size = 96
font_family = ""
subtitle_font_size = 18
subtitle_font_family = ""
border_radius = -1
padding_x = -1
padding_y = -1
border_width = 0
backdrop_color = ""

[monitor_select.hotkeys]
"Escape" = "idle"

[scroll]
scroll_step = 50
scroll_step_half = 500
scroll_step_full = 1000000
invert_scroll = false

[scroll.hotkeys]
"Escape" = "idle"
"Up" = "action scroll_up"
"Down" = "action scroll_down"
"Left" = "action scroll_left"
"Right" = "action scroll_right"
"gg" = "action go_top"
"Shift+G" = "action go_bottom"
"Shift+/" = "action page_up"
"/" = "action page_down"
"e" = "action left_click"
"i" = "action right_click"
"o" = "action middle_click"
"u" = "action left_click --state down"
"y" = "action left_click --state up"
# Left-hand home row = mouse move (right hand carries the NAV layer)
"s" = "action move_mouse_relative --dx=0 --dy=-5"
"n" = "action move_mouse_relative --dx=0 --dy=5"
"r" = "action move_mouse_relative --dx=-5 --dy=0"
"d" = "action move_mouse_relative --dx=5 --dy=0"
# Diagonals: row above/below the R/D columns (no simultaneous-key composition in neru)
"f" = "action move_mouse_relative --dx=-5 --dy=-5"
"v" = "action move_mouse_relative --dx=5 --dy=-5"
"x" = "action move_mouse_relative --dx=-5 --dy=5"
"c" = "action move_mouse_relative --dx=5 --dy=5"

[mode_indicator]

[mode_indicator.scroll]
enabled = true
text = "Scroll"

[mode_indicator.hints]
enabled = false
text = "Hints"

[mode_indicator.grid]
enabled = false
text = "Grid"

[mode_indicator.recursive_grid]
enabled = false
text = "Recursive Grid"

[mode_indicator.monitor_select]
enabled = false
text = "Monitor Select"

[mode_indicator.ui]
font_size = 10
font_family = ""
border_width = 1
padding_x = -1
padding_y = -1
border_radius = -1
indicator_x_offset = 20
indicator_y_offset = 20

[sticky_modifiers]
enabled = true
tap_max_duration = 300

[sticky_modifiers.ui]
font_size = 10
font_family = ""
border_width = 1
padding_x = -1
padding_y = -1
border_radius = -1
indicator_x_offset = -40
indicator_y_offset = 20

[smooth_cursor]
move_mouse_enabled = false
steps = 10
max_duration = 200
duration_per_pixel = 0.1
relative_movement_duration = 50

[smooth_scroll]
enabled = true
steps = 20
max_duration = 180
duration_per_pixel = 1.00

[held_repeat]
enabled = true
initial_delay_ms = 60
interval_ms = 10
accel_enabled = true
accel_ramp_ms = 2500
accel_max_multiplier = 35.0
accel_targets = ["move_mouse_relative"] # only target supported today — scroll accel tracked in y3owk1n/neru#1104

[systray]
enabled = false

[logging]
log_level = "warn"
log_file = "/tmp/neru.log"
disable_file_logging = false
max_file_size = 10
max_backups = 5
max_age = 30

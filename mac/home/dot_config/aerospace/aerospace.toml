config-version = 2
start-at-login = true

# Workspaces that stay alive even when empty and invisible
persistent-workspaces = ["1", "2", "3", "4"]

automatically-unhide-macos-hidden-apps = true

[mode.main.binding]
    #alt-right = 'focus --wrap-around dfs-next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    alt-minus = 'resize smart -50'

    # Ported from archive/hypr/.config/hypr/hyprland.conf
    #alt-r = 'exec-and-forget osascript -e "tell application \"System Events\" to key code 49 using command down"' # launcher (Spotlight), hypr: albert
    alt-f = 'fullscreen'
    alt-c = 'close'
    alt-v = 'layout floating tiling'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'

    # Toggle between tiled and accordion layouts
    alt-backslash = 'layout tiles accordion'

    # Cycle through windows in the current workspace
    alt-j = 'focus --wrap-around dfs-next'
    alt-k = 'focus --wrap-around dfs-prev'

    alt-tab = 'workspace-back-and-forth'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']
